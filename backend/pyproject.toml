[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jobseeker-agent-backend"
version = "0.1.0"
description = "求职 Agent backend — agentic job-seeking assistant (dual-protocol LLM gateway, agent harness, MCP client)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.6.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
openai = ["openai>=1.0.0"]
anthropic = ["anthropic>=0.25.0"]
search = ["ddgs>=3.0.0"]
mcp = ["mcp>=1.0.0"]
all = ["openai>=1.0.0", "anthropic>=0.25.0", "ddgs>=3.0.0", "mcp>=1.0.0"]
dev = ["pytest>=7.4.0", "pytest-asyncio>=0.23.0", "ruff>=0.4.0", "mypy>=1.8.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = true
